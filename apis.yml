name: Sino Biological
description: >-
  Sino Biological is a global life-science reagent supplier and contract research
  organization founded in 2007, headquartered in Beijing, China, with a US
  subsidiary in Wayne, Pennsylvania and offices across Europe. The company
  manufactures and sells recombinant proteins, antibodies, ELISA kits, cDNA
  clones, and other research reagents in-house, and provides contract biologics
  services (protein production, antibody development, gene synthesis) for
  academic, biopharmaceutical, and diagnostic customers worldwide. Originally
  added to the API Evangelist network as a portfolio-company stub of Qiming
  Venture Partners, this profile was run through the enrichment pipeline; no
  public developer API, developer portal, or programmatic-access surface was
  discoverable (the corporate site is bot-protected and returns HTTP 403 to
  automated clients).
